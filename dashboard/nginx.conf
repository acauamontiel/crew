# Servidor do dashboard do crew (usado por bin/dashboard).
# Serve o index.html e, de $CREW_WORKTREES (montado só leitura em /srv/tasks),
# apenas a lista de tasks e os arquivos .json/.md dentro de <task>/.crew/.
# O código das worktrees e links simbólicos (ex.: .env) nunca são servidos.
server {
  listen 80;
  root /srv/app;
  index index.html;
  disable_symlinks on;
  add_header Cache-Control "no-store" always;

  location = / { }
  location = /index.html { }

  location = /tasks/ {
    alias /srv/tasks/;
    autoindex on;
    autoindex_format json;
  }

  location ~ "^/tasks/([^/]+)/\.crew/([A-Za-z0-9._/-]+\.(json|md))$" {
    alias /srv/tasks/$1/.crew/$2;
    default_type text/plain;
    charset utf-8;
  }

  location / { return 404; }
}
